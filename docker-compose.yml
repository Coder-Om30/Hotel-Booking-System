# ==========================================
# Docker Compose - Hotel Booking System Stack
# MySQL 8.0 + Spring Boot Backend + React/Nginx Frontend
# ==========================================

services:
  # 1. Relational Database Service
  mysql:
    image: mysql:8.0
    container_name: hbs_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Pass@123}
      MYSQL_DATABASE: ${DB_NAME:-hotel_booking_db}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p${DB_PASSWORD:-Pass@123} --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - hbs_network

  # 2. Spring Boot REST API Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hbs_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-hotel_booking_db}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-Pass@123}
      APP_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:80,http://localhost
      APP_CURRENCY: ${APP_CURRENCY:-INR}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      HOLD_EXPIRY_MINUTES: ${HOLD_EXPIRY_MINUTES:-15}
      CANCELLATION_WINDOW_HOURS: ${CANCELLATION_WINDOW_HOURS:-24}
    ports:
      - "8080:8080"
    networks:
      - hbs_network

  # 3. React Frontend + Nginx Reverse Proxy Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hbs_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
      - "80:80"
    networks:
      - hbs_network

volumes:
  mysql_data:
    driver: local

networks:
  hbs_network:
    driver: bridge
