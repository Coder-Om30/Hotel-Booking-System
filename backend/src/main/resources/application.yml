server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: hotel-booking-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hotel_booking_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  business:
    currency: ${APP_CURRENCY:INR}
    timezone: ${APP_TIMEZONE:Asia/Kolkata}
    hold-expiry-minutes: ${HOLD_EXPIRY_MINUTES:15}
    cancellation-window-hours: ${CANCELLATION_WINDOW_HOURS:24}
